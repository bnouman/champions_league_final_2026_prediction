name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check imports
        run: |
          python -c "import numpy, pandas, sklearn, pymc, arviz; print('Dependency import check passed')"

      - name: Syntax check scripts
        run: |
          python -m py_compile predict_final_form_rf.py
          python -m py_compile predict_final_hierarchical_bayes.py
